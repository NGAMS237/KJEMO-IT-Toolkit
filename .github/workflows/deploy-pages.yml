# =============================================================================
# deploy-pages.yml — LOT 0 · KJEMO IT Toolkit
# =============================================================================
# Déploie dist/ sur GitHub Pages UNIQUEMENT après validation complète.
#
# Déclenchement : push sur main (après merge autorisé par Blaise).
# Le déploiement ne démarre pas si le job validate échoue.
#
# Contrainte : ne fusionner dans main et ne déployer qu'avec l'autorisation
# explicite de Blaise ou du chef d'orchestre.
# =============================================================================

name: Deploy GitHub Pages — LOT 0

on:
  push:
    branches:
      - main

# Permissions nécessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validation complète (réutilise validate.yml)
  # ---------------------------------------------------------------------------
  validate:
    name: Validation complète (syntaxe PS + tests)
    uses: ./.github/workflows/validate.yml

  # ---------------------------------------------------------------------------
  # 1 bis. Validation de la chaîne Bash — LOT 7
  # ---------------------------------------------------------------------------
  validate-linux:
    name: Validation Linux (hygiène .sh, shQuote, bash -n, ShellCheck)
    uses: ./.github/workflows/validate-linux.yml

  # ---------------------------------------------------------------------------
  # 2. Déploiement GitHub Pages — uniquement si les DEUX validations sont OK
  #
  # « needs » liste les deux jobs. GitHub ne démarre « deploy » que si TOUS les
  # jobs listés ont réussi : un échec Windows OU un échec Linux arrête le
  # déploiement. Il n'y a volontairement aucune condition `if` sur ce job :
  # une condition du genre « if: always() » ou « if: success() || ... » le
  # ferait démarrer malgré un échec, ce qui est exactement ce qu'on refuse.
  # test/ci-workflows.test.mjs relit ce fichier et le vérifie.
  # ---------------------------------------------------------------------------
  deploy:
    name: Déployer sur GitHub Pages
    needs: [validate, validate-linux]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier dist/ comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Publier uniquement le contenu de dist/
          path: KJEMO-IT-Toolkit-v0.1/dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

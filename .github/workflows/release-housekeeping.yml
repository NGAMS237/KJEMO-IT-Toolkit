name: Release housekeeping (one-off)
on:
  push:
    branches: ['claude/deployment-housekeeping-20261022']
permissions:
  actions: write
  contents: read
jobs:
  cancel-redundant-runs:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel superseded validation runs; keep final deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_CONTROL_BRANCH: claude/deployment-housekeeping-20261022
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          base='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          ids={39853937125,39853937214,39853972806,39854001020}
          req=urllib.request.Request(base+'/actions/runs?branch='+os.environ['GH_CONTROL_BRANCH']+'&per_page=20',headers=headers)
          with urllib.request.urlopen(req) as r: runs=json.load(r)['workflow_runs']
          ids.update(r['id'] for r in runs if r['name']=='PS Syntax Check — LOT 0' and r['status']!='completed')
          for run_id in sorted(ids):
              req=urllib.request.Request(base+'/actions/runs/'+str(run_id)+'/cancel',headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req) as r: print('Cancellation accepted:',run_id,r.status)
              except urllib.error.HTTPError as e:
                  if e.code==409: print('Already finished:',run_id)
                  else: raise
          print('Final deployment 39854000902 left intact.')
          PY

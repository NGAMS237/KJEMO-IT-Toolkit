# =============================================================================
# validate.yml — LOT 0 · KJEMO IT Toolkit
# =============================================================================
# Workflow réutilisable (workflow_call) : vérification syntaxe PS + tests.
# Appelé par ps-syntax-check.yml (push/PR) et deploy-pages.yml (déploiement).
#
# Contrainte : ne fusionner dans main et ne déployer qu'avec l'autorisation
# explicite de Blaise ou du chef d'orchestre.
# =============================================================================

name: Validate — LOT 0 (réutilisable)

on:
  workflow_call:
    outputs:
      status:
        description: "OK ou FAIL"
        value: ${{ jobs.validate.outputs.status }}

jobs:
  validate:
    name: Vérification syntaxe PowerShell (5.1 + 7) + Tests complets
    runs-on: windows-latest
    outputs:
      status: ${{ steps.set-status.outputs.status }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Node.js 20
      # -----------------------------------------------------------------------
      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------------------------------------------------
      # 3. Installer les dépendances (npm ci — utilise le package-lock.json)
      # -----------------------------------------------------------------------
      - name: Installer les dépendances Node.js
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: npm ci
        shell: bash

      # -----------------------------------------------------------------------
      # 4. Vérification syntaxe Node.js des modules
      # -----------------------------------------------------------------------
      - name: Vérification syntaxe Node.js (dist/generators.mjs)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node --input-type=module --check < dist/generators.mjs
        shell: bash

      - name: Vérification syntaxe Node.js (dist/app.js)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node --input-type=module --check < dist/app.js
        shell: bash

      # -----------------------------------------------------------------------
      # 5. Tests fonctionnels Node.js (Section A + B)
      # -----------------------------------------------------------------------
      - name: Tests fonctionnels Node.js (identity.test.mjs)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/identity.test.mjs
        shell: bash

      # -----------------------------------------------------------------------
      # 6. Générer les .ps1 (64 fichiers — 8 assistants × 8 jeux valides)
      # -----------------------------------------------------------------------
      - name: Générer les scripts .ps1
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/generate-ps1.mjs
        shell: bash

      # -----------------------------------------------------------------------
      # 7. Lister les fichiers générés
      # -----------------------------------------------------------------------
      - name: Lister les fichiers générés
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: Get-ChildItem test/generated/*.ps1 | ForEach-Object { Write-Host $_.Name }
        shell: pwsh

      # -----------------------------------------------------------------------
      # 8. Parsing PowerShell 5.1
      # -----------------------------------------------------------------------
      - name: Parsing PowerShell 5.1 (powershell.exe)
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          $ErrorCount = 0
          $Files = Get-ChildItem test\generated\*.ps1
          foreach ($File in $Files) {
              $Tokens      = $null
              $ParseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $File.FullName,
                  [ref]$Tokens,
                  [ref]$ParseErrors
              )
              if ($ParseErrors.Count -gt 0) {
                  Write-Host "[PS5.1 ECHEC] $($File.Name)" -ForegroundColor Red
                  foreach ($Err in $ParseErrors) {
                      Write-Host ("  Ligne {0}, col {1} : {2}" -f `
                          $Err.Extent.StartLineNumber, `
                          $Err.Extent.StartColumnNumber, `
                          $Err.Message) -ForegroundColor Red
                  }
                  $ErrorCount++
              } else {
                  Write-Host "[PS5.1 OK]    $($File.Name)" -ForegroundColor Green
              }
          }
          if ($ErrorCount -gt 0) {
              Write-Error "$ErrorCount fichier(s) PS 5.1 en erreur de parsing."
              exit 1
          }

      # -----------------------------------------------------------------------
      # 9. Parsing PowerShell 7
      # -----------------------------------------------------------------------
      - name: Parsing PowerShell 7 (pwsh)
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          $ErrorCount = 0
          $Files = Get-ChildItem test/generated/*.ps1
          foreach ($File in $Files) {
              $Tokens      = $null
              $ParseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $File.FullName,
                  [ref]$Tokens,
                  [ref]$ParseErrors
              )
              if ($ParseErrors.Count -gt 0) {
                  Write-Host "[PS7 ECHEC]   $($File.Name)" -ForegroundColor Red
                  foreach ($Err in $ParseErrors) {
                      Write-Host ("  Ligne {0}, col {1} : {2}" -f `
                          $Err.Extent.StartLineNumber, `
                          $Err.Extent.StartColumnNumber, `
                          $Err.Message) -ForegroundColor Red
                  }
                  $ErrorCount++
              } else {
                  Write-Host "[PS7 OK]      $($File.Name)" -ForegroundColor Green
              }
          }
          if ($ErrorCount -gt 0) {
              Write-Error "$ErrorCount fichier(s) PS 7 en erreur de parsing."
              exit 1
          }

      # -----------------------------------------------------------------------
      # 10. Aller-retour Unicode réel JS → PS1 → PowerShell (v2)
      # -----------------------------------------------------------------------
      - name: Aller-retour Unicode réel PS 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: powershell.exe -File .\scripts\Test-PS-Roundtrip-v2.ps1

      - name: Aller-retour Unicode réel PS 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: pwsh -File .\scripts\Test-PS-Roundtrip-v2.ps1

      # -----------------------------------------------------------------------
      # 11. Installer Playwright/Chromium et exécuter les tests navigateur
      # -----------------------------------------------------------------------
      - name: Installer les navigateurs Playwright
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: npx playwright install chromium --with-deps
        shell: bash

      - name: Tests navigateur Playwright (pipeline Copier/Télécharger + Section B)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/browser-identity.test.mjs
        shell: bash
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ''   # utilise le Chromium installé par playwright install

      # -----------------------------------------------------------------------
      # 12. Rapport d'artefact (toujours, même en cas d'échec)
      # -----------------------------------------------------------------------
      - name: Publier les .ps1 générés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1-generated-${{ github.sha }}
          path: KJEMO-IT-Toolkit-v0.1/test/generated/
          retention-days: 14

      # -----------------------------------------------------------------------
      # 13. Résultat
      # -----------------------------------------------------------------------
      - name: Définir le statut de sortie
        id: set-status
        if: always()
        run: echo "status=${{ job.status }}" >> $GITHUB_OUTPUT
        shell: bash

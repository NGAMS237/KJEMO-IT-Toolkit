# =============================================================================
# validate.yml — LOT 0 · KJEMO IT Toolkit
# =============================================================================
# Workflow réutilisable (workflow_call) : syntaxe PowerShell, contre-épreuves
# d'exécution sous les deux moteurs, puis tests Node et navigateur.
# Appelé par ps-syntax-check.yml (push/PR) et deploy-pages.yml (déploiement).
#
# Contrainte : ne fusionner dans main et ne déployer qu'avec l'autorisation
# explicite de Blaise ou du chef d'orchestre.
# =============================================================================

name: Validate — LOT 0 (réutilisable)

on:
  workflow_call:
    outputs:
      status:
        description: "OK ou FAIL"
        value: ${{ jobs.validate.outputs.status }}

jobs:
  validate:
    name: Syntaxe PS (5.1 + 7), contre-épreuves d'exécution et tests complets
    runs-on: windows-latest
    outputs:
      status: ${{ steps.set-status.outputs.status }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Node.js 20
      # -----------------------------------------------------------------------
      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------------------------------------------------
      # 3. Installer les dépendances (npm ci — utilise le package-lock.json)
      # -----------------------------------------------------------------------
      - name: Installer les dépendances Node.js
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: npm ci
        shell: bash

      # -----------------------------------------------------------------------
      # 4. Vérification syntaxe Node.js des modules
      # -----------------------------------------------------------------------
      - name: Vérification syntaxe Node.js (dist/generators.mjs)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node --input-type=module --check < dist/generators.mjs
        shell: bash

      - name: Vérification syntaxe Node.js (dist/app.js)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node --input-type=module --check < dist/app.js
        shell: bash

      # -----------------------------------------------------------------------
      # 5. Tests fonctionnels Node.js (Section A + B)
      # -----------------------------------------------------------------------
      - name: Tests fonctionnels Node.js (identity.test.mjs)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/identity.test.mjs
        shell: bash

      # -----------------------------------------------------------------------
      # 6. Générer les .ps1 (176 fichiers — 22 assistants × 8 jeux valides)
      #    Le script vérifie aussi que les 64 scripts historiques sont restés
      #    identiques aux empreintes figées dans test/scripts-baseline.json.
      # -----------------------------------------------------------------------
      - name: Générer les scripts .ps1
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/generate-ps1.mjs
        shell: bash

      # -----------------------------------------------------------------------
      # 6 bis. Non-régression des 856 scripts PowerShell historiques — LOT 7
      #
      # Ajout, pas remplacement : aucune étape existante n'est touchée. La
      # baseline est versionnée dans test/scripts-baseline-856.json et la
      # comparaison porte sur l'OCTET écrit, BOM compris.
      # -----------------------------------------------------------------------
      - name: Non-régression des 856 scripts PowerShell
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/baseline-856.test.mjs
        shell: bash

      # -----------------------------------------------------------------------
      # 7. Lister les fichiers générés
      # -----------------------------------------------------------------------
      - name: Lister les fichiers générés
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: Get-ChildItem test/generated/*.ps1 | ForEach-Object { Write-Host $_.Name }
        shell: pwsh

      # -----------------------------------------------------------------------
      # 8. Parsing PowerShell 5.1
      # -----------------------------------------------------------------------
      - name: Parsing PowerShell 5.1 (powershell.exe)
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          $ErrorCount = 0
          $Files = Get-ChildItem test\generated\*.ps1
          foreach ($File in $Files) {
              $Tokens      = $null
              $ParseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $File.FullName,
                  [ref]$Tokens,
                  [ref]$ParseErrors
              )
              if ($ParseErrors.Count -gt 0) {
                  Write-Host "[PS5.1 ECHEC] $($File.Name)" -ForegroundColor Red
                  foreach ($Err in $ParseErrors) {
                      Write-Host ("  Ligne {0}, col {1} : {2}" -f `
                          $Err.Extent.StartLineNumber, `
                          $Err.Extent.StartColumnNumber, `
                          $Err.Message) -ForegroundColor Red
                  }
                  $ErrorCount++
              } else {
                  Write-Host "[PS5.1 OK]    $($File.Name)" -ForegroundColor Green
              }
          }
          if ($ErrorCount -gt 0) {
              Write-Error "$ErrorCount fichier(s) PS 5.1 en erreur de parsing."
              exit 1
          }

      # -----------------------------------------------------------------------
      # 9. Parsing PowerShell 7
      # -----------------------------------------------------------------------
      - name: Parsing PowerShell 7 (pwsh)
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          $ErrorCount = 0
          $Files = Get-ChildItem test/generated/*.ps1
          foreach ($File in $Files) {
              $Tokens      = $null
              $ParseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $File.FullName,
                  [ref]$Tokens,
                  [ref]$ParseErrors
              )
              if ($ParseErrors.Count -gt 0) {
                  Write-Host "[PS7 ECHEC]   $($File.Name)" -ForegroundColor Red
                  foreach ($Err in $ParseErrors) {
                      Write-Host ("  Ligne {0}, col {1} : {2}" -f `
                          $Err.Extent.StartLineNumber, `
                          $Err.Extent.StartColumnNumber, `
                          $Err.Message) -ForegroundColor Red
                  }
                  $ErrorCount++
              } else {
                  Write-Host "[PS7 OK]      $($File.Name)" -ForegroundColor Green
              }
          }
          if ($ErrorCount -gt 0) {
              Write-Error "$ErrorCount fichier(s) PS 7 en erreur de parsing."
              exit 1
          }

      # -----------------------------------------------------------------------
      # 10. Garde-fou : BOM UTF-8 sur les scripts .ps1 AVANT l'exécution PS 5.1
      #     Sans BOM, PS 5.1 lit le fichier en CP1252 ; un tiret cadratin (—)
      #     y devient un guillemet fermant et casse l'analyse syntaxique.
      # -----------------------------------------------------------------------
      - name: Vérifier le BOM UTF-8 des scripts PowerShell
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/check-ps1-bom.mjs

      - name: Confirmer les 3 premiers octets de Test-PS-Roundtrip-v2.ps1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          $Bytes = [System.IO.File]::ReadAllBytes("scripts\Test-PS-Roundtrip-v2.ps1")[0..2]
          $Hex = ($Bytes | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          Write-Host "Premiers octets : $Hex"
          if ($Bytes[0] -ne 0xEF -or $Bytes[1] -ne 0xBB -or $Bytes[2] -ne 0xBF) {
              Write-Error "BOM UTF-8 absent : $Hex au lieu de EF BB BF"
              exit 1
          }

      # -----------------------------------------------------------------------
      # 11. Aller-retour Unicode réel JS → PS1 → PowerShell (v2)
      # -----------------------------------------------------------------------
      - name: Aller-retour Unicode réel PS 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: powershell.exe -File .\scripts\Test-PS-Roundtrip-v2.ps1

      - name: Aller-retour Unicode réel PS 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: pwsh -File .\scripts\Test-PS-Roundtrip-v2.ps1

      # -----------------------------------------------------------------------
      # 12. Contre-épreuve d'exécution — ad-home-profile-paths
      #
      # Ce test n'inspecte pas le texte du script : il l'EXÉCUTE, dans une
      # session où New-Item, Set-Acl et Set-ADUser sont remplacés par des
      # mouchards, et où Export-Csv réussit ou lève selon la passe.
      #
      #   PASSE A — sauvegarde en échec : aucune modification ne doit avoir lieu
      #   PASSE B — contrôle positif     : les modifications doivent avoir lieu
      #   PASSE C — défaut réintroduit   : la passe A doit le détecter
      #
      # Les deux moteurs sont éprouvés séparément, et l'interpréteur est
      # IMPOSÉ à chaque fois : le test échoue s'il est absent, et ne se rabat
      # jamais sur l'autre. Un résultat obtenu sous PowerShell 7 ne dit rien
      # de Windows PowerShell 5.1, qui reste la cible de référence.
      #
      # Ces deux étapes précèdent les tests navigateur et bloquent le workflow
      # en cas d'échec : aucune continue-on-error, aucun `if` permissif.
      # -----------------------------------------------------------------------
      - name: Contre-épreuve sauvegarde bloquante — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/sauvegarde-bloquante.test.mjs --powershell powershell
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuve PS 5.1 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Contre-épreuve sauvegarde bloquante — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/sauvegarde-bloquante.test.mjs --powershell pwsh
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuve PS 7 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      # -----------------------------------------------------------------------
      # 11 ter. Contre-épreuves d'exécution du LOT 5 — les verrous bloquent-ils ?
      #
      # La revue du LOT 5 a relevé deux assistants qui CALCULAIENT une
      # vérification sans en faire dépendre leur écriture : `dns-client-change`
      # éprouvait les serveurs DNS, `route-manager` calculait l'appartenance de
      # la passerelle à un préfixe directement connecté — et ni l'un ni l'autre
      # n'en tirait de conséquence.
      #
      # Ces deux bancs exécutent réellement les scripts, cmdlets d'écriture
      # remplacées par des mouchards, et comptent les appels. Chacun porte sa
      # propre contre-épreuve : le verrou retiré, le test DOIT échouer.
      #
      # Comme les précédentes, elles tournent sous les DEUX moteurs, avec
      # l'interpréteur imposé, sans continue-on-error et sans `if` permissif.
      # -----------------------------------------------------------------------
      - name: Contre-épreuve changement DNS bloquant — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/dns-change-bloquant.test.mjs --powershell powershell
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuve DNS PS 5.1 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Contre-épreuve changement DNS bloquant — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/dns-change-bloquant.test.mjs --powershell pwsh
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuve DNS PS 7 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Contre-épreuve passerelle bloquante — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/route-passerelle-bloquante.test.mjs --powershell powershell
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuve route PS 5.1 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Contre-épreuve passerelle bloquante — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/route-passerelle-bloquante.test.mjs --powershell pwsh
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuve route PS 7 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      # -----------------------------------------------------------------------
      # 11 quater. Contre-épreuves d'exécution du LOT 6 — les verrous bloquent-ils ?
      #
      # Trois assistants du LOT 6 modifient l'etat de la machine : redemarrage
      # des services audio, reinitialisation de Windows Update, arret d'un
      # processus. Chacun porte un verrou, et ce banc verifie qu'il BLOQUE —
      # en executant les scripts, cmdlets modifiantes remplacees par des
      # mouchards, et en comptant les appels.
      #
      # Il porte ses propres contre-epreuves : chaque verrou est desarme tour a
      # tour, et le test doit alors voir l'appel interdit. Le second verrou de
      # la reparation Windows Update — celui qui empeche de renommer un dossier
      # qu'un service tient encore ouvert — a sa contre-epreuve distincte.
      #
      # Comme les precedentes : les DEUX moteurs, interpreteur impose, sans
      # continue-on-error.
      # -----------------------------------------------------------------------
      - name: Contre-épreuves des verrous LOT 6 — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/poste-verrous.test.mjs --powershell powershell
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuves LOT 6 PS 5.1 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Contre-épreuves des verrous LOT 6 — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          node test/poste-verrous.test.mjs --powershell pwsh
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Contre-epreuves LOT 6 PS 7 en echec (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      # -----------------------------------------------------------------------
      # 11 quinquies. Fiches du LOT 6B — le contrat, outil par outil
      #
      # Ce banc est petit et cible les 18 assistants du LOT 6B : fiche
      # complete, risque coherent avec requiresAdmin, validation qui accepte
      # ses propres valeurs par defaut, generate() qui ne leve pas, aucun
      # motif interdit dans le CODE execute, et script accepte par le parseur
      # du moteur IMPOSE.
      #
      # Il porte quatre contre-epreuves internes : la regle sur le BCD est
      # eprouvee sur une copie fautive, pour qu'une regle devenue aveugle ne
      # puisse pas passer pour une regle respectee.
      # -----------------------------------------------------------------------
      - name: Fiches du LOT 6B — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -eq 'Core') {
              Write-Error "Repli silencieux detecte : cette etape doit tourner sous Windows PowerShell, pas sous PowerShell 7."
              exit 1
          }
          node test/fiches-poste-b.test.mjs --powershell powershell
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Fiches LOT 6B en echec sous PS 5.1 (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Fiches du LOT 6B — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne 'Core') {
              Write-Error "Repli silencieux detecte : cette etape doit tourner sous PowerShell 7."
              exit 1
          }
          node test/fiches-poste-b.test.mjs --powershell pwsh
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Fiches LOT 6B en echec sous PS 7 (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      # -----------------------------------------------------------------------
      # 11 septies. Jonction de domaine (LOT 7, commit 24/n) — les verrous
      #
      # Trois assistants PowerShell, executes dans une session ou Add-Computer,
      # Remove-Computer, Rename-Computer, Set-DnsClientServerAddress,
      # Set-TimeZone, Reset-ComputerMachinePassword et Get-Credential sont des
      # DOUBLURES qui consignent chaque appel. Le banc COMPTE les appels.
      #
      # LA PREUVE CENTRALE : Add-Computer n'est appele que lorsque les onze
      # conditions sont reunies, et le parametre de redemarrage n'est passe
      # dans AUCUNE passe. Le secret vient de Get-Credential, apres le verrou,
      # et la doublure rend un mot de passe reconnaissable que le banc cherche
      # ensuite dans la sortie, dans le journal et dans le rapport.
      #
      # Huit passes de refus, un controle positif, et une contre-epreuve du
      # banc lui-meme : un appel reel a Add-Computer doit etre vu.
      #
      # Les DEUX moteurs, interpreteur impose, sans continue-on-error. Sous
      # Windows PowerShell 5.1 la mesure porte sur le moteur de reference ;
      # sous PowerShell 7, le banc le dit — l'applet de jonction n'y existe
      # pas, et elle n'est ici qu'une doublure.
      # -----------------------------------------------------------------------
      - name: Verrous de jonction de domaine — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -eq 'Core') {
              Write-Error "Repli silencieux detecte : cette etape doit tourner sous Windows PowerShell, pas sous PowerShell 7."
              exit 1
          }
          node test/jonction-domaine.test.mjs --powershell powershell
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Verrous de jonction en echec sous PS 5.1 (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Verrous de jonction de domaine — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne 'Core') {
              Write-Error "Repli silencieux detecte : cette etape doit tourner sous PowerShell 7."
              exit 1
          }
          node test/jonction-domaine.test.mjs --powershell pwsh
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Verrous de jonction en echec sous PS 7 (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      # -----------------------------------------------------------------------
      # 11 sexies. Sources citees — controle de FORME, hors ligne
      #
      # La verification EN LIGNE (code HTTP reel, titre reel, detection des
      # pages « contenu introuvable » qui repondent 200) est faite hors CI et
      # son rapport est versionne : LOT-6B-SOURCES.json. Elle n'est pas jouee
      # ici parce qu'elle depend d'un service tiers : une coupure reseau chez
      # Microsoft ferait echouer un workflow qui ne doit echouer que sur un
      # defaut du depot, et « continue-on-error » est interdit.
      #
      # Ce qui est joue ici est le controle de forme : toute source doit etre
      # une URL Microsoft bien formee et citee par une fiche. Le rapport dit
      # alors explicitement NON VERIFIE EN LIGNE.
      # -----------------------------------------------------------------------
      - name: Sources citées — contrôle de forme (hors ligne)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/sources-microsoft.mjs --hors-ligne
        shell: bash

      # -----------------------------------------------------------------------
      # 12 bis. Contrôle des commandes externes — LOT 4
      #
      # Un script qui appelle une applet de commande inexistante n'echoue pas
      # quand on l'ecrit : il echoue chez la personne, en production. Le LOT 4
      # en portait un exemple, un appel a « Get-GPOBackup » qui n'a jamais fait
      # partie du module GroupPolicy.
      #
      # Le banc lit la GRAMMAIRE de chaque script genere et refuse toute
      # commande absente de dist/cmdlets.mjs. Il tourne sous les DEUX moteurs,
      # et sous Windows PowerShell 5.1 il interroge en plus Get-Command pour
      # les modules reellement presents sur l'agent.
      #
      # Aucune continue-on-error, aucun repli : si le banc echoue, le workflow
      # echoue.
      # -----------------------------------------------------------------------
      - name: Exporter l'inventaire des commandes externes
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/cmdlets-export.mjs
        shell: bash

      - name: Contrôle des commandes GPO — Windows PowerShell 5.1
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: powershell
        run: |
          Write-Host "Moteur impose : powershell.exe"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -eq 'Core') {
              Write-Error "Repli silencieux detecte : cette etape doit tourner sous Windows PowerShell, pas sous PowerShell 7."
              exit 1
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-KjemoCmdlets.ps1 -VerifierPresence
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Controle des commandes en echec sous PS 5.1 (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      - name: Contrôle des commandes GPO — PowerShell 7
        working-directory: KJEMO-IT-Toolkit-v0.1
        shell: pwsh
        run: |
          Write-Host "Moteur impose : pwsh"
          Write-Host "Version du moteur : $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne 'Core') {
              Write-Error "Repli silencieux detecte : cette etape doit tourner sous PowerShell 7."
              exit 1
          }
          pwsh -NoProfile -File ./scripts/Test-KjemoCmdlets.ps1 -VerifierPresence
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Controle des commandes en echec sous PS 7 (code $LASTEXITCODE)."
              exit $LASTEXITCODE
          }

      # -----------------------------------------------------------------------
      # 13. Installer Playwright/Chromium et exécuter les tests navigateur
      # -----------------------------------------------------------------------
      - name: Installer les navigateurs Playwright
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: npx playwright install chromium --with-deps
        shell: bash

      - name: Tests navigateur Playwright (pipeline Copier/Télécharger + Section B)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/browser-identity.test.mjs
        shell: bash
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ''   # utilise le Chromium installé par playwright install

      # -----------------------------------------------------------------------
      # 13 bis. Tests navigateur du LOT 6B
      #
      # browser-identity.test.mjs parcourt les 107 outils et eprouve, pour
      # chacun, Copier, Telecharger, le BOM UTF-8 du fichier telecharge et
      # l'identite octet par octet avec generate(). Ce banc-ci couvre ce qui
      # est propre au LOT 6B : les 18 fiches dans la grille, les cinq
      # sous-rubriques, les routes directes, la desactivation des boutons
      # apres modification d'un champ, les erreurs par champ, les phrases de
      # confirmation tapees a la main, la recherche par symptome et par
      # message d'erreur, les favoris, les deux modes, les trois themes, le
      # 390 px sans debordement et la navigation au clavier.
      # -----------------------------------------------------------------------
      - name: Tests navigateur LOT 6B (18 assistants)
        working-directory: KJEMO-IT-Toolkit-v0.1
        run: node test/browser-poste-b.test.mjs
        shell: bash
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ''

      # -----------------------------------------------------------------------
      # 14. Rapport d'artefact (toujours, même en cas d'échec)
      # -----------------------------------------------------------------------
      - name: Publier les .ps1 générés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1-generated-${{ github.sha }}
          path: KJEMO-IT-Toolkit-v0.1/test/generated/
          retention-days: 14

      # -----------------------------------------------------------------------
      # 15. Résultat
      # -----------------------------------------------------------------------

# =============================================================================
# ps-syntax-check.yml — LOT 0 · KJEMO IT Toolkit
# =============================================================================
# Vérifie la syntaxe PowerShell des huit assistants après chaque push ou PR
# sur les branches claude/** et main.
#
# Ce workflow délègue à validate.yml (workflow réutilisable) qui effectue :
#   1. Génération des 64 fichiers .ps1 (8 assistants × 8 jeux de données).
#   2. Vérification syntaxe avec PS 5.1 (powershell.exe) et PS 7 (pwsh).
#   3. Tests fonctionnels Node.js (identity.test.mjs — sections A et B).
#   4. Tests aller-retour Unicode (Test-PS-Roundtrip.ps1).
#   5. Tests navigateur Playwright (browser-identity.test.mjs).
#   6. Échec si UNE SEULE erreur de parsing ou de test est trouvée.
#
# Ce que ce CI ne fait PAS :
#   - Il n'exécute pas les scripts PowerShell (pas de VM Windows active).
#   - Il ne déploie pas sur GitHub Pages (voir deploy-pages.yml).
#   - Il ne fusionne pas dans main sans autorisation explicite de Blaise.
#
# Contrainte : ne fusionner dans main et ne déployer qu'avec l'autorisation
# explicite de Blaise ou du chef d'orchestre.
# =============================================================================

name: PS Syntax Check — LOT 0

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  validate:
    name: Validation complète (syntaxe PS + tests)
    uses: ./.github/workflows/validate.yml
